[[language]]
name = "toml"

[[language]]
name = "php"
language-servers = ["phptools"]
auto-format = true
formatter = { command = "pint-fmt" }

[language-server.phptools]
command = "/Users/jacksonfrankland/Library/pnpm/devsense-php-ls"
args = ["--stdio"]

# The license key comes from DEVSENSE_PHP_LS_LICENSE, set in shell/.zshrc
[language-server.phptools.config]

# TypeScript, Vue and Svelte servers come from helix/lsp (installed by install.sh), not
# pnpm globals: TypeScript 7 has no tsserver, and pnpm 11+ global paths change
# on every reinstall
[language-server.vuels]
command = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/.bin/vue-language-server"
args = ["--stdio"]
timeout = 60

[language-server.vuels.config]
typescript = { tsdk = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/typescript/lib" }

[language-server.typescript-language-server]
command = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/.bin/typescript-language-server"
args = ["--stdio"]

[language-server.typescript-language-server.config]
tsserver = { path = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/typescript/lib/tsserver.js" }
plugins = [{ name = "@vue/typescript-plugin", location = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/@vue/typescript-plugin", languages = ["vue"] }]

[[language]]
name = "vue"
auto-format = true
language-servers = [
  { name = "typescript-language-server", except-features = ["format"] },
  { name = "vuels", except-features = ["diagnostics", "completion"] },
]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "/Users/jacksonfrankland/.local/share/vite-plus/bin/vp", args = ["fmt", "--stdin-filepath=%{buffer_name}", "--config=/Users/jacksonfrankland/Code/dotfiles/helix/oxfmtrc.json"] }
# formatter = { command = "pnpm", args = ["exec","biome","check", "--stdin-file-path=%{buffer_name}", "--write"] }
[language-server.emmet-language-server]
command = "emmet-language-server"
args = ["--stdio"]

[[language]]
name = "html"
auto-format = true
language-servers = ["vscode-html-language-server", "emmet-language-server", "tailwindcss-ls"]
indent = { tab-width = 4, unit = "    " }
formatter = { command = "/Users/jacksonfrankland/.local/share/vite-plus/bin/vp", args = ["fmt", "--stdin-filepath=%{buffer_name}", "--config=/Users/jacksonfrankland/Code/dotfiles/helix/oxfmtrc.json"] }

[[languages]]
name = "go"
auto-format = true
formatter = { command = "goimports" }

[[language]]
name = "bash"
language-servers = ["bash-language-server"]
file-types = ["sh", "bash", ".functions"]

[language-server.bash-language-server]
command = "bash-language-server"
args = ["start"]

[[language]]
name = "gdscript"
language-servers = ["godot"]

[language-server.godot]
command = "nc"
args = ["localhost", "6005"]

[[language]]
name = "svelte"
auto-format = true
text-width = 120
scope = "source.svelte"
injection-regex = "svelte"
file-types = ["svelte"]
language-servers = [
  "svelteserver",
  # "emmet-lsp",
  # "efm-lsp",
  # "eslint",
  "tailwindcss-ls",
]
# no formatter: svelteserver formats with its bundled Prettier, following the
# project's Prettier config if it has one, else this 4-space indent
indent = { tab-width = 4, unit = "    " }

[language-server.svelteserver]
command = "/Users/jacksonfrankland/Code/dotfiles/helix/lsp/node_modules/.bin/svelteserver"
args = ["--stdio"]
