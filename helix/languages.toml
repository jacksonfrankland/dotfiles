[language-server]
biome = { command = "biome", args = ["lsp-proxy"] }

# Web languages format with Vite+ (vp fmt, i.e. Oxfmt) at 4-space indents, set
# in helix/oxfmtrc.json. It overrides any formatter config in the project
[[language]]
name = "json"
auto-format = false
indent = { tab-width = 4, unit = "    " }
formatter = { command = "/Users/jacksonfrankland/.local/share/vite-plus/bin/vp", args = ["fmt", "--stdin-filepath=%{buffer_name}", "--config=/Users/jacksonfrankland/Code/dotfiles/helix/oxfmtrc.json"] }

[[language]]
name = "javascript"
auto-format = true
indent = { tab-width = 4, unit = "    " }
formatter = { command = "/Users/jacksonfrankland/.local/share/vite-plus/bin/vp", args = ["fmt", "--stdin-filepath=%{buffer_name}", "--config=/Users/jacksonfrankland/Code/dotfiles/helix/oxfmtrc.json"] }

